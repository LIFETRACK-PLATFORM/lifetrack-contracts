syntax = "proto3";

package lifetrack.finance;

service FinanceService {
  rpc CreateAccount (CreateAccountRequest) returns (AccountResponse);
  rpc ListAccounts (ListAccountsRequest) returns (ListAccountsResponse);
  rpc UpdateAccount (UpdateAccountRequest) returns (AccountResponse);
  rpc DeleteAccount (DeleteAccountRequest) returns (DeleteAccountResponse);
  rpc CreateCategory (CreateCategoryRequest) returns (CategoryResponse);
  rpc ListCategories (ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc UpdateCategory (UpdateCategoryRequest) returns (CategoryResponse);
  rpc DeleteCategory (DeleteCategoryRequest) returns (DeleteCategoryResponse);
  rpc CreateTransaction (CreateTransactionRequest) returns (TransactionResponse);
  rpc UpdateTransaction (UpdateTransactionRequest) returns (TransactionResponse);
  rpc DeleteTransaction (DeleteTransactionRequest) returns (DeleteTransactionResponse);
  rpc ListTransactions (ListTransactionsRequest) returns (ListTransactionsResponse);
  rpc CreateBudget (CreateBudgetRequest) returns (BudgetResponse);
  rpc UpdateBudget (UpdateBudgetRequest) returns (BudgetResponse);
  rpc DeleteBudget (DeleteBudgetRequest) returns (DeleteBudgetResponse);
  rpc ListBudgets (ListBudgetsRequest) returns (ListBudgetsResponse);
  rpc GetBudgetStatus (GetBudgetStatusRequest) returns (BudgetStatusResponse);
  rpc GetMonthlySummary (GetMonthlySummaryRequest) returns (GetMonthlySummaryResponse);
  rpc CreateRecurringItem (CreateRecurringItemRequest) returns (RecurringItemResponse);
  rpc UpdateRecurringItem (UpdateRecurringItemRequest) returns (RecurringItemResponse);
  rpc DeleteRecurringItem (DeleteRecurringItemRequest) returns (DeleteRecurringItemResponse);
  rpc ListRecurringItems (ListRecurringItemsRequest) returns (ListRecurringItemsResponse);
  rpc ProcessRecurringItems (ProcessRecurringItemsRequest) returns (ProcessRecurringItemsResponse);
  rpc DetectRecurringCandidates (DetectRecurringCandidatesRequest) returns (DetectRecurringCandidatesResponse);
  rpc CreateDebt (CreateDebtRequest) returns (DebtResponse);
  rpc UpdateDebt (UpdateDebtRequest) returns (DebtResponse);
  rpc DeleteDebt (DeleteDebtRequest) returns (DeleteDebtResponse);
  rpc ListDebts (ListDebtsRequest) returns (ListDebtsResponse);
  rpc RegisterDebtPayment (RegisterDebtPaymentRequest) returns (RegisterDebtPaymentResponse);
  rpc AdjustDebtBalance (AdjustDebtBalanceRequest) returns (DebtResponse);
  rpc GetDebtsSummary (GetDebtsSummaryRequest) returns (GetDebtsSummaryResponse);
}

message CreateAccountRequest {
  string name = 1;
  string type = 2;
  string currency = 3;
  double initialBalance = 4;
}

message UpdateAccountRequest {
  string accountId = 1;
  string name = 2;
  string type = 3;
  string currency = 4;
}

message DeleteAccountRequest {
  string accountId = 1;
}

message DeleteAccountResponse {
  bool deleted = 1;
}

message AccountResponse {
  string accountId = 1;
  string userId = 2;
  string name = 3;
  string type = 4;
  string currency = 5;
  double balance = 6;
}

message ListAccountsRequest {}

message ListAccountsResponse {
  repeated AccountResponse accounts = 1;
}

message CreateCategoryRequest {
  string name = 1;
  string kind = 2;
  string icon = 3;
  string color = 4;
}

message UpdateCategoryRequest {
  string categoryId = 1;
  string name = 2;
  string icon = 3;
  string color = 4;
}

message DeleteCategoryRequest {
  string categoryId = 1;
}

message DeleteCategoryResponse {
  bool deleted = 1;
}

message CategoryResponse {
  string categoryId = 1;
  string userId = 2;
  string name = 3;
  string kind = 4;
  string icon = 5;
  string color = 6;
}

message ListCategoriesRequest {}

message ListCategoriesResponse {
  repeated CategoryResponse categories = 1;
}

message CreateTransactionRequest {
  string accountId = 1;
  string categoryId = 2;
  double amount = 3;
  string kind = 4;
  string description = 5;
  string occurredAt = 6;
  string recurringItemId = 7;
}

message TransactionResponse {
  string transactionId = 1;
  string accountId = 2;
  string categoryId = 3;
  double amount = 4;
  string kind = 5;
  string description = 6;
  string occurredAt = 7;
  double accountBalanceAfter = 8;
  bool budgetExceeded = 9;
}

message UpdateTransactionRequest {
  string transactionId = 1;
  double amount = 2;
  string description = 3;
  string occurredAt = 4;
}

message DeleteTransactionRequest {
  string transactionId = 1;
}

message DeleteTransactionResponse {
  bool deleted = 1;
  double accountBalanceAfter = 2;
}

message ListTransactionsRequest {
  string accountId = 1;
  string categoryId = 2;
  string fromDate = 3;
  string toDate = 4;
}

message ListTransactionsResponse {
  repeated TransactionResponse transactions = 1;
}

message CreateBudgetRequest {
  string categoryId = 1;
  double amount = 2;
  int32 periodMonth = 3;
  int32 periodYear = 4;
}

message UpdateBudgetRequest {
  string budgetId = 1;
  double amount = 2;
}

message DeleteBudgetRequest {
  string budgetId = 1;
}

message DeleteBudgetResponse {
  bool deleted = 1;
}

message BudgetResponse {
  string budgetId = 1;
  string categoryId = 2;
  double amount = 3;
  int32 periodMonth = 4;
  int32 periodYear = 5;
}

message ListBudgetsRequest {
  int32 periodMonth = 1;
  int32 periodYear = 2;
}

message ListBudgetsResponse {
  repeated BudgetResponse budgets = 1;
}

message GetBudgetStatusRequest {
  string categoryId = 1;
  int32 periodMonth = 2;
  int32 periodYear = 3;
}

message BudgetStatusResponse {
  string categoryId = 1;
  int32 periodMonth = 2;
  int32 periodYear = 3;
  double budgetAmount = 4;
  double spentAmount = 5;
  bool exceeded = 6;
}

message GetMonthlySummaryRequest {
  int32 periodMonth = 1;
  int32 periodYear = 2;
}

message CategoryExpenseSummary {
  string categoryId = 1;
  double amount = 2;
}

message CurrencyMonthlySummary {
  string currency = 1;
  double totalIncome = 2;
  double totalExpense = 3;
  double netAmount = 4;
  repeated CategoryExpenseSummary expensesByCategory = 5;
}

message GetMonthlySummaryResponse {
  repeated CurrencyMonthlySummary summaries = 1;
}

message CreateRecurringItemRequest {
  string name = 1;
  double amount = 2;
  string kind = 3;
  string accountId = 4;
  string categoryId = 5;
  int32 dayOfMonth = 6;
  string mode = 7;
}

message UpdateRecurringItemRequest {
  string recurringItemId = 1;
  string name = 2;
  double amount = 3;
  string kind = 4;
  string accountId = 5;
  string categoryId = 6;
  int32 dayOfMonth = 7;
  string mode = 8;
  bool active = 9;
}

message DeleteRecurringItemRequest {
  string recurringItemId = 1;
}

message DeleteRecurringItemResponse {
  bool deleted = 1;
}

message RecurringItemResponse {
  string recurringItemId = 1;
  string userId = 2;
  string name = 3;
  double amount = 4;
  string kind = 5;
  string accountId = 6;
  string categoryId = 7;
  int32 dayOfMonth = 8;
  string mode = 9;
  bool active = 10;
}

message ListRecurringItemsRequest {}

message ListRecurringItemsResponse {
  repeated RecurringItemResponse items = 1;
}

message ProcessRecurringItemsRequest {}

message ProcessRecurringItemsResponse {
  repeated RecurringItemResponse pendingReminders = 1;
  repeated TransactionResponse generatedTransactions = 2;
}

message DetectRecurringCandidatesRequest {}

message RecurringCandidateResponse {
  string accountId = 1;
  string categoryId = 2;
  double amount = 3;
  string kind = 4;
  int32 dayOfMonth = 5;
  int32 occurrences = 6;
  string suggestedName = 7;
  string lastOccurredAt = 8;
}

message DetectRecurringCandidatesResponse {
  repeated RecurringCandidateResponse candidates = 1;
}

message CreateDebtRequest {
  string name = 1;
  string lender = 2;
  string type = 3;
  string currency = 4;
  double totalOwed = 5;
  double originalAmount = 6;
  double minimumPayment = 7;
  int32 dueDay = 8;
  string accountId = 9;
  string categoryId = 10;
  int32 installmentCount = 11;
  int32 startingInstallment = 12;
}

message UpdateDebtRequest {
  string debtId = 1;
  string name = 2;
  string lender = 3;
  string type = 4;
  string currency = 5;
  double originalAmount = 6;
  double minimumPayment = 7;
  int32 dueDay = 8;
  string accountId = 9;
  string categoryId = 10;
  int32 installmentCount = 11;
  int32 startingInstallment = 12;
}

message DeleteDebtRequest {
  string debtId = 1;
}

message DeleteDebtResponse {
  bool deleted = 1;
  bool archived = 2;
}

message DebtResponse {
  string debtId = 1;
  string userId = 2;
  string name = 3;
  string lender = 4;
  string type = 5;
  string currency = 6;
  double totalOwed = 7;
  double originalAmount = 8;
  double minimumPayment = 9;
  int32 dueDay = 10;
  string accountId = 11;
  string categoryId = 12;
  string status = 13;
  int32 lastPaymentMonth = 14;
  int32 lastPaymentYear = 15;
  int32 installmentCount = 16;
  int32 startingInstallment = 17;
  int32 currentInstallment = 18;
  double totalInterestPaid = 19;
}

message ListDebtsRequest {}

message ListDebtsResponse {
  repeated DebtResponse debts = 1;
}

message RegisterDebtPaymentRequest {
  string debtId = 1;
  string accountId = 2;
  double amount = 3;
  string description = 4;
  string occurredAt = 5;
  double interestAmount = 6;
}

message RegisterDebtPaymentResponse {
  string transactionId = 1;
  string debtId = 2;
  double amount = 3;
  double totalOwedAfter = 4;
  string statusAfter = 5;
  double accountBalanceAfter = 6;
  string occurredAt = 7;
}

message AdjustDebtBalanceRequest {
  string debtId = 1;
  double newTotalOwed = 2;
}

message GetDebtsSummaryRequest {
  int32 periodMonth = 1;
  int32 periodYear = 2;
}

message DebtCurrencySummary {
  string currency = 1;
  double totalOwed = 2;
  double totalDueThisPeriod = 3;
  int32 activeCount = 4;
}

message GetDebtsSummaryResponse {
  repeated DebtCurrencySummary summaries = 1;
}
